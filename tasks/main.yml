---
# --------------------------------

- name: "Include variables wrapper"
  ansible.builtin.include_tasks:
    file: variables.yml
  tags: ["ct-datadog"]

- name: "Disto/Family tasks (FF)"
  ansible.builtin.include_tasks:
    file: "{{ lookup('ansible.builtin.first_found', params) }}"
  vars:
    params:
      files:
      - "{{ ansible_facts['distribution'] }}-{{ ansible_facts['distribution_major_version'].split('.')[0] }}.yml"
      - "{{ ansible_facts['distribution'] }}.yml"
      - "{{ ansible_facts['os_family'] }}.yml"
      - "default.yml"
  tags: ["ct-datadog"]

- name: "Include {{ ansible_facts['os_family'] | lower }} tasks"
  ansible.builtin.include_tasks: setup-{{ ansible_facts['os_family'] | lower }}.yml
  when:
  - ansible_facts['os_family'] == "Debian" or ansible_facts['os_family'] == "RedHat"
  tags: ["ct-datadog"]

- name: "Install config file"
  ansible.builtin.include_tasks: install_config.yml
  tags: ["ct-datadog"]

- name: "Include post install tasks"
  ansible.builtin.include_tasks: post_tasks.yml
  tags: ["ct-datadog"]

